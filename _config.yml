title: Coink | DO BOOM!
copyright_start_year: 2015
author:
  name: CoinkWang
  email: cn.coink.wang@gmail.com
description: > # this means to ignore newlines until "show_subtitle:"
  Coink's Blog

show_subtitle: true

# 主题样式切换：
#   bugatti — 新版，Bugatti 风格（纯黑底 + 白色全大写宽间距，无装饰，默认）
#   claude  — Anthropic Claude 风格（暖米黄 + 珊瑚 + 衬线）
#   apple   — Apple 风格（白底 + 深蓝 + SF Pro，无衬线）
#   denise  — Denise Chandler 风格（黄油奶黄底 + 珊瑚红 + 手写 Caveat 标题 + 贴纸卡片）
#   glance  — 旧版，PaperCSS 手绘风格
#   fieldguide — 鸟类学家观察手册（陈纸 + 墨色 + 苔绿 + 朱砂印章，手绘群鸟）
#   pixel  — 4 阶像素掌机相机（夜间液晶屏 + 热敏打印纸条，像素群鸟，喜鹊站标）
theme_style: pixel

header_pages:
  - about.md
  - links.md

permalink: /:title.html

# date format
# refer to https://shopify.github.io/liquid/filters/date/ if you want to customize this
glance:
  date_format: "%Y-%m-%d"

# Build settings
# theme: glance

plugins:
 - jekyll-feed
 - jekyll-seo-tag
 - jekyll-paginate

# 添加分页配置
paginate: 10  # 每页显示的文章数量
paginate_path: "/page/:num/"  # 分页URL路径格式 

# 设计文档（impeccable 生成）只给自己看，不发布到站点；其余为 Jekyll 默认排除项
exclude:
  - PRODUCT.md
  - DESIGN.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
